apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp244-api
  labels:
    app: mp244-api
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp244-api
  template:
    metadata:
      labels:
        app: mp244-api
        tier: api
    spec:
      containers:
        - name: mp244-api
          image: mp244-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
